<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Awake OS">
  <defs>
    <linearGradient id="void" x1="6" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F2E"/>
      <stop offset="1" stop-color="#1A3A4D"/>
    </linearGradient>
    <linearGradient id="cyan" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#40F0D8"/>
      <stop offset="1" stop-color="#00E5C0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded mark -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#void)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" stroke="rgba(64,240,216,0.35)" stroke-width="1"/>

  <!-- Neural filaments -->
  <g stroke="url(#cyan)" stroke-width="1.15" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <path d="M9 22 L12.5 14.5 L16 18 L19.5 10.5 L23 16"/>
    <path d="M10 11 L14 16.5" opacity="0.7"/>
    <path d="M18 20 L22 12" opacity="0.65"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glow)">
    <circle cx="9" cy="22" r="1.7" fill="#40F0D8"/>
    <circle cx="12.5" cy="14.5" r="1.55" fill="#5CE8D5"/>
    <circle cx="16" cy="18" r="1.85" fill="#40F0D8"/>
    <circle cx="19.5" cy="10.5" r="1.55" fill="#00E5C0"/>
    <circle cx="23" cy="16" r="1.7" fill="#40F0D8"/>
    <!-- Orange hardware accent node -->
    <circle cx="16" cy="18" r="0.55" fill="#FF6B35"/>
    <circle cx="23" cy="16" r="1.05" fill="none" stroke="#FF6B35" stroke-width="0.85" opacity="0.95"/>
  </g>
</svg>
