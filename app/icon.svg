<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Awake OS">
  <!--
    Awake OS favicon — high-contrast neural mark
    Readable at 16×16 / 32×32. Void teal · cyan filaments · orange accent.
  -->
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1C28"/>
      <stop offset="1" stop-color="#143648"/>
    </linearGradient>
  </defs>

  <!-- App-icon tile -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)"/>
  <rect x="1.75" y="1.75" width="28.5" height="28.5" rx="6.25"
        stroke="#40F0D8" stroke-opacity="0.28" stroke-width="1.25"/>

  <!-- Neural filaments (thick for small sizes) -->
  <g stroke="#40F0D8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- primary path -->
    <path d="M8.5 22.5 L12.2 14.2 L16 18.5 L20 10.5 L23.5 16.2"/>
    <!-- secondary bridges -->
    <path d="M12.2 14.2 L16 10.8" opacity="0.85"/>
    <path d="M16 18.5 L20.8 20.2" opacity="0.75"/>
  </g>

  <!-- Nodes -->
  <circle cx="8.5" cy="22.5" r="2.15" fill="#40F0D8"/>
  <circle cx="12.2" cy="14.2" r="1.85" fill="#5CE8D5"/>
  <circle cx="16" cy="18.5" r="2.35" fill="#40F0D8"/>
  <circle cx="20" cy="10.5" r="1.85" fill="#00E5C0"/>
  <circle cx="23.5" cy="16.2" r="2.05" fill="#40F0D8"/>
  <circle cx="16" cy="10.8" r="1.45" fill="#5CE8D5"/>
  <circle cx="20.8" cy="20.2" r="1.45" fill="#5CE8D5"/>

  <!-- Orange hardware accent (center + right node ring) -->
  <circle cx="16" cy="18.5" r="0.85" fill="#FF6B35"/>
  <circle cx="23.5" cy="16.2" r="3.05" fill="none" stroke="#FF6B35" stroke-width="1.35"/>
</svg>
